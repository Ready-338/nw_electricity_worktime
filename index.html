<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전기파트 근무표</title>

<style>
    body {
        font-family: "맑은 고딕", Arial, sans-serif;
        margin: 0;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #1565c0;
        color: white;
        padding: 20px;
        text-align: center;
    }

    .menu {
        display: flex;
        justify-content: center;
        gap: 10px;
        background: white;
        padding: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        position: sticky;
        top: 0;
        z-index: 10;
    }

    .menu button {
        border: none;
        background: #1976d2;
        color: white;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
    }

    .menu button:hover {
        background: #0d47a1;
    }

    .container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 0 15px;
    }

    .section {
        display: none;
    }

    .section.active {
        display: block;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
        margin-top: 0;
        color: #1565c0;
    }

    .date-title {
        font-weight: bold;
        margin-bottom: 15px;
        color: #555;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 10px;
    }

    th {
        background: #1976d2;
        color: white;
        padding: 10px;
        border: 1px solid #ddd;
    }

    td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: center;
        vertical-align: top;
        min-width: 110px;
    }

    .shift1 {
        background: #e3f2fd;
    }

    .shift2 {
        background: #fff8e1;
    }

    .shift3 {
        background: #ede7f6;
    }

    .off {
        background: #eeeeee;
        color: #777;
    }

    .today {
        outline: 4px solid #ff5722;
        outline-offset: -4px;
    }

    .group-title {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 6px;
    }

    .time {
        font-size: 14px;
        color: #444;
        margin-bottom: 8px;
    }

    .names {
        line-height: 1.7;
        font-size: 14px;
    }

    .month-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
    }

    .month-controls button {
        border: none;
        background: #455a64;
        color: white;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
    }

    .notice {
        background: #fff3cd;
        border-left: 5px solid #ffc107;
        padding: 12px;
        margin-top: 15px;
    }

    @media print {
        header,
        .menu,
        .month-controls,
        .notice {
            display: none;
        }

        body {
            background: white;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .card {
            box-shadow: none;
            border: none;
            padding: 0;
        }

        table {
            font-size: 12px;
        }

        th, td {
            padding: 6px;
        }
    }

    @media (max-width: 768px) {
        table {
            font-size: 13px;
        }

        th, td {
            min-width: 95px;
            padding: 8px;
        }

        .table-wrap {
            overflow-x: auto;
        }
    }
</style>
</head>

<body>

<header>
    <h1>⚡ 전기파트 근무표</h1>
    <div>자동 순환 근무표</div>
</header>

<div class="menu">
    <button onclick="showSection('week')">이번주 근무</button>
    <button onclick="showSection('month')">월전체 근무</button>
    <button onclick="window.print()">출력</button>
</div>

<div class="container">

    <section id="week" class="section active">
        <div class="card">
            <h2>이번주 근무표</h2>
            <div id="weekTitle" class="date-title"></div>
            <div class="table-wrap">
                <table id="weekTable"></table>
            </div>

            <div class="notice">
                ※ 근무조는 매주 화요일 기준으로 자동 변경됩니다.<br>
                순환 방식 : 1근조 → 3근조 → 2근조 → 1근조
            </div>
        </div>
    </section>

    <section id="month" class="section">
        <div class="card">
            <h2>월전체 근무표</h2>

            <div class="month-controls">
                <button onclick="changeMonth(-1)">이전달</button>
                <strong id="monthTitle"></strong>
                <button onclick="changeMonth(1)">다음달</button>
            </div>

            <div class="table-wrap">
                <table id="monthTable"></table>
            </div>
        </div>
    </section>

</div>

<script>
const baseTuesday = new Date(2026, 5, 2); 
// 2026년 6월 2일 화요일 기준
// JavaScript 월은 0부터 시작하므로 5 = 6월

const baseGroups = {
    1: ["강태진", "김승수", "곽명수"],
    2: ["오솔민", "엄성환", "박승훈"],
    3: ["노재덕", "박종필", "이경민"]
};

let currentMonthDate = new Date();

function getWeekStartTuesday(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = (day >= 2) ? day - 2 : day + 5;
    d.setDate(d.getDate() - diff);
    d.setHours(0,0,0,0);
    return d;
}

function getWeekIndex(date) {
    const targetTuesday = getWeekStartTuesday(date);
    const diffDays = Math.floor((targetTuesday - baseTuesday) / (1000 * 60 * 60 * 24));
    return Math.floor(diffDays / 7);
}

function rotateGroup(baseGroup, weekIndex) {
    const cycle = [1, 3, 2];
    const baseIndex = cycle.indexOf(baseGroup);
    const newIndex = ((baseIndex + weekIndex) % 3 + 3) % 3;
    return cycle[newIndex];
}

function getGroupsForDate(date) {
    const weekIndex = getWeekIndex(date);
    const result = {};

    for (const baseGroup in baseGroups) {
        const currentGroup = rotateGroup(Number(baseGroup), weekIndex);
        result[currentGroup] = baseGroups[baseGroup];
    }

    return result;
}

function getWorkInfo(date, groupNumber) {
    const day = date.getDay();

    // 화~금
    if (day >= 2 && day <= 5) {
        if (groupNumber === 1) return { label: "1근조", time: "06:30 ~ 14:30" };
        if (groupNumber === 2) return { label: "2근조", time: "14:30 ~ 22:30" };
        if (groupNumber === 3) return { label: "3근조", time: "22:30 ~ 06:30" };
    }

    // 토요일
    if (day === 6) {
        if (groupNumber === 1) return { label: "1근조 주간", time: "06:30 ~ 18:30" };
        if (groupNumber === 2) return { label: "휴무", time: "-" };
        if (groupNumber === 3) return { label: "3근조 야간", time: "18:30 ~ 06:30" };
    }

    // 일요일
    if (day === 0) {
        if (groupNumber === 1) return { label: "휴무", time: "-" };
        if (groupNumber === 2) return { label: "2근조 주간", time: "06:30 ~ 18:30" };
        if (groupNumber === 3) return { label: "3근조 야간", time: "18:30 ~ 06:30" };
    }

    // 월요일
    if (day === 1) {
        if (groupNumber === 1) return { label: "1근조 야간", time: "18:30 ~ 06:30" };
        if (groupNumber === 2) return { label: "2근조 주간", time: "06:30 ~ 18:30" };
        if (groupNumber === 3) return { label: "휴무", time: "-" };
    }

    return { label: "-", time: "-" };
}

function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    return `${y}-${m}-${d} (${days[date.getDay()]})`;
}

function isToday(date) {
    const today = new Date();
    return date.getFullYear() === today.getFullYear() &&
           date.getMonth() === today.getMonth() &&
           date.getDate() === today.getDate();
}

function renderCell(date, groupNumber) {
    const groups = getGroupsForDate(date);
    const names = groups[groupNumber] || [];
    const work = getWorkInfo(date, groupNumber);

    let cssClass = `shift${groupNumber}`;
    if (work.label === "휴무") cssClass = "off";
    if (isToday(date)) cssClass += " today";

    return `
        <td class="${cssClass}">
            <div class="group-title">${work.label}</div>
            <div class="time">${work.time}</div>
            <div class="names">${names.join("<br>")}</div>
        </td>
    `;
}

function renderWeek() {
    const today = new Date();
    const start = getWeekStartTuesday(today);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);

    document.getElementById("weekTitle").innerText =
        `${formatDate(start)} ~ ${formatDate(end)}`;

    let html = "<tr>";
    for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        html += `<th>${formatDate(d)}</th>`;
    }
    html += "</tr>";

    for (let group = 1; group <= 3; group++) {
        html += "<tr>";
        for (let i = 0; i < 7; i++) {
            const d = new Date(start);
            d.setDate(start.getDate() + i);
            html += renderCell(d, group);
        }
        html += "</tr>";
    }

    document.getElementById("weekTable").innerHTML = html;
}

function renderMonth() {
    const year = currentMonthDate.getFullYear();
    const month = currentMonthDate.getMonth();

    document.getElementById("monthTitle").innerText =
        `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);

    let html = "";

    for (let d = new Date(firstDay); d <= lastDay; d.setDate(d.getDate() + 1)) {
        const date = new Date(d);

        html += `
            <tr>
                <th colspan="3">${formatDate(date)}</th>
            </tr>
            <tr>
                ${renderCell(date, 1)}
                ${renderCell(date, 2)}
                ${renderCell(date, 3)}
            </tr>
        `;
    }

    document.getElementById("monthTable").innerHTML = html;
}

function changeMonth(offset) {
    currentMonthDate.setMonth(currentMonthDate.getMonth() + offset);
    renderMonth();
}

function showSection(id) {
    document.querySelectorAll(".section").forEach(sec => {
        sec.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    if (id === "week") renderWeek();
    if (id === "month") renderMonth();
}

renderWeek();
renderMonth();
</script>

</body>
</html>
