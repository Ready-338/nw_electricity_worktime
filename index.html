<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전기파트 근무표</title>

<style>
    body {
        font-family: "맑은 고딕", Arial, sans-serif;
        margin: 0;
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: #1565c0;
        color: white;
        padding: 20px;
        text-align: center;
    }


    .container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 0 15px;
    }

    .section {
        display: none;
    }

    .section.active {
        display: block;
    }

    .card {
        background: white;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
        margin-top: 0;
        color: #1565c0;
    }

    .week-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 8px;
    }

    .week-header h2 {
        margin: 0;
    }

    .print-button {
        border: none;
        background: #1976d2;
        color: white;
        padding: 9px 14px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        white-space: nowrap;
    }

    .print-button:hover {
        background: #0d47a1;
    }

    .date-title {
        font-weight: bold;
        margin-bottom: 15px;
        color: #555;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 10px;
    }

    th {
        background: #1976d2;
        color: white;
        padding: 10px;
        border: 1px solid #ddd;
    }

    td {
        border: 1px solid #ddd;
        padding: 10px;
        text-align: center;
        vertical-align: middle;
        min-width: 110px;
    }

    .shift1 {
        background: #e3f2fd;
    }

    .shift2 {
        background: #fff8e1;
    }

    .shift3 {
        background: #ede7f6;
    }

    .day-shift {
        background: #e8f5e9;
    }

    .night-shift {
        background: #dbeafe;
    }

    .today-col {
        border-left: 3px solid #81c784 !important;
        border-right: 3px solid #81c784 !important;
    }

    .today-top {
        border-top: 3px solid #81c784 !important;
    }

    .today-bottom {
        border-bottom: 3px solid #81c784 !important;
    }

    .group-title {
        font-weight: bold;
        font-size: 16px;
        margin-bottom: 6px;
    }

    .time {
        font-size: 14px;
        color: #444;
        margin-bottom: 8px;
    }

    .names {
        line-height: 1.7;
        font-size: 14px;
    }


    .notice {
        padding: 12px;
        margin-top: 15px;
        border-radius: 6px;
        line-height: 1.7;
    }

    .red-notice {
        background: #ffebee;
        border-left: 5px solid #e53935;
    }

    .yellow-notice {
        background: #fff3cd;
        border-left: 5px solid #ffc107;
    }

    .week-day-cell {
        height: 110px;
        box-sizing: border-box;
    }

    .week-holiday-cell {
        padding: 0;
        height: 330px;
        box-sizing: border-box;
    }

    .holiday-half {
        height: 50%;
        padding: 10px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .holiday-half:first-child {
        border-bottom: 1px solid #ddd;
    }

    @page {
        size: A4 landscape;
        margin: 8mm;
    }

    @media print {
        body {
            background: white;
            margin: 0;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body * {
            visibility: hidden;
        }

        .print-area,
        .print-area * {
            visibility: visible;
        }

        .print-area {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            box-shadow: none;
            border: none;
            padding: 0;
            margin: 0;
        }

        .print-button,
        .notice {
            display: none !important;
        }

        .week-header {
            margin-bottom: 4px;
        }

        .week-header h2 {
            font-size: 18px;
            margin: 0 0 4px 0;
        }

        .date-title {
            font-size: 12px;
            margin-bottom: 6px;
        }

        .table-wrap {
            overflow: visible;
        }

        table {
            width: 100%;
            table-layout: fixed;
            font-size: 11px;
            margin-top: 0;
            page-break-inside: avoid;
        }

        th {
            padding: 4px 2px;
            font-size: 10.5px;
        }

        td {
            padding: 4px 2px;
            min-width: 0;
        }

        .week-day-cell {
            height: 66px;
        }

        .week-holiday-cell {
            height: 198px;
        }

        .holiday-half {
            padding: 4px 2px;
        }

        .group-title {
            font-size: 12px;
            margin-bottom: 2px;
        }

        .time {
            font-size: 10.5px;
            margin-bottom: 3px;
        }

        .names {
            font-size: 11px;
            line-height: 1.35;
        }
    }

    @media (max-width: 768px) {
        table {
            font-size: 13px;
        }

        th, td {
            min-width: 95px;
            padding: 8px;
        }

        .table-wrap {
            overflow-x: auto;
        }
    }
</style>
</head>

<body>

<header>
    <h1>⚡ 전기파트 근무표</h1>
</header>


<div class="container">

    <section id="week" class="section active">
        <div class="card print-area">
            <div class="week-header">
                <h2>이번주 근무표</h2>
                <button class="print-button" onclick="window.print()">출력</button>
            </div>
            <div id="weekTitle" class="date-title"></div>
            <div class="table-wrap">
                <table id="weekTable"></table>
            </div>

            <div class="notice red-notice">
                ※ 해당 사이트는 자동입니다.<br>
                &nbsp;&nbsp;- 명절 및 휴가기간 근무 편성은 별도로 운영됩니다.<br>
                &nbsp;&nbsp;- 개인 연차, 경조는 해당 표에 반영되지 않습니다.
            </div>

            <div class="notice yellow-notice">
                ※ 근무조는 매주 화요일 기준으로 자동 변경됩니다.<br>
                순환 방식 : 1근조 → 3근조 → 2근조 → 1근조
            </div>
        </div>
    </section>


</div>

<script>
const baseTuesday = new Date(2026, 5, 2);
// 2026년 6월 2일 화요일 기준
// JavaScript 월은 0부터 시작하므로 5 = 6월

const baseGroups = {
    1: ["강태진", "김승수", "곽명수"],
    2: ["오솔민", "엄성환", "박승훈"],
    3: ["노재덕", "박종필", "이경민"]
};

let currentMonthDate = new Date();

function getWeekStartTuesday(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = (day >= 2) ? day - 2 : day + 5;
    d.setDate(d.getDate() - diff);
    d.setHours(0,0,0,0);
    return d;
}

function getWeekIndex(date) {
    const targetTuesday = getWeekStartTuesday(date);
    const diffDays = Math.floor((targetTuesday - baseTuesday) / (1000 * 60 * 60 * 24));
    return Math.floor(diffDays / 7);
}

function rotateGroup(baseGroup, weekIndex) {
    const cycle = [1, 3, 2];
    const baseIndex = cycle.indexOf(baseGroup);
    const newIndex = ((baseIndex + weekIndex) % 3 + 3) % 3;
    return cycle[newIndex];
}

function getGroupsForDate(date) {
    const weekIndex = getWeekIndex(date);
    const result = {};

    for (const baseGroup in baseGroups) {
        const currentGroup = rotateGroup(Number(baseGroup), weekIndex);
        result[currentGroup] = baseGroups[baseGroup];
    }

    return result;
}

function getHolidayShift(date, shiftType) {
    const day = date.getDay();
    const groups = getGroupsForDate(date);

    if (day === 6) {
        if (shiftType === "day") return { label: "주간", time: "06:30 ~ 18:30", names: groups[1] };
        if (shiftType === "night") return { label: "야간", time: "18:30 ~ 06:30", names: groups[3] };
    }

    if (day === 0) {
        if (shiftType === "day") return { label: "주간", time: "06:30 ~ 18:30", names: groups[2] };
        if (shiftType === "night") return { label: "야간", time: "18:30 ~ 06:30", names: groups[3] };
    }

    if (day === 1) {
        if (shiftType === "day") return { label: "주간", time: "06:30 ~ 18:30", names: groups[2] };
        if (shiftType === "night") return { label: "야간", time: "18:30 ~ 06:30", names: groups[1] };
    }

    return { label: "", time: "", names: [] };
}

function getWeekdayWorkInfo(groupNumber) {
    if (groupNumber === 1) return { label: "1근조", time: "06:30 ~ 14:30" };
    if (groupNumber === 2) return { label: "2근조", time: "14:30 ~ 22:30" };
    if (groupNumber === 3) return { label: "3근조", time: "22:30 ~ 06:30" };
    return { label: "-", time: "-" };
}

function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    return `${y}-${m}-${d} (${days[date.getDay()]})`;
}

function isToday(date) {
    const today = new Date();
    return date.getFullYear() === today.getFullYear() &&
           date.getMonth() === today.getMonth() &&
           date.getDate() === today.getDate();
}

function getTodayClass(date, rowIndex, totalRows) {
    if (!isToday(date)) return "";

    let cls = " today-col";
    if (rowIndex === 0) cls += " today-top";
    if (rowIndex === totalRows - 1) cls += " today-bottom";
    return cls;
}

function renderWeekdayCell(date, groupNumber, rowIndex, totalRows) {
    const groups = getGroupsForDate(date);
    const names = groups[groupNumber] || [];
    const work = getWeekdayWorkInfo(groupNumber);

    return `
        <td class="week-day-cell shift${groupNumber}${getTodayClass(date, rowIndex, totalRows)}">
            <div class="group-title">${work.label}</div>
            <div class="time">${work.time}</div>
            <div class="names">${names.join("<br>")}</div>
        </td>
    `;
}

function renderHolidayCombinedCell(date, totalRows) {
    const dayWork = getHolidayShift(date, "day");
    const nightWork = getHolidayShift(date, "night");
    const todayClass = isToday(date) ? " today-col today-top today-bottom" : "";

    return `
        <td rowspan="${totalRows}" class="week-holiday-cell${todayClass}">
            <div class="holiday-half day-shift">
                <div class="group-title">${dayWork.label}</div>
                <div class="time">${dayWork.time}</div>
                <div class="names">${dayWork.names.join("<br>")}</div>
            </div>
            <div class="holiday-half night-shift">
                <div class="group-title">${nightWork.label}</div>
                <div class="time">${nightWork.time}</div>
                <div class="names">${nightWork.names.join("<br>")}</div>
            </div>
        </td>
    `;
}

function renderWeek() {
    const today = new Date();
    const start = getWeekStartTuesday(today);
    const end = new Date(start);
    end.setDate(start.getDate() + 6);

    document.getElementById("weekTitle").innerText =
        `${formatDate(start)} ~ ${formatDate(end)}`;

    let html = "<tr>";

    for (let i = 0; i < 7; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);
        html += `<th>${formatDate(d)}</th>`;
    }

    html += "</tr>";

    const totalRows = 3;

    for (let row = 0; row < totalRows; row++) {
        html += "<tr>";

        for (let i = 0; i < 7; i++) {
            const d = new Date(start);
            d.setDate(start.getDate() + i);
            const day = d.getDay();

            if (day >= 2 && day <= 5) {
                html += renderWeekdayCell(d, row + 1, row, totalRows);
            } else {
                if (row === 0) {
                    html += renderHolidayCombinedCell(d, totalRows);
                }
            }
        }

        html += "</tr>";
    }

    document.getElementById("weekTable").innerHTML = html;
}

function renderMonthDayBlock(date) {
    const day = date.getDay();

    let html = `
        <tr>
            <th colspan="3">${formatDate(date)}</th>
        </tr>
    `;

    if (day >= 2 && day <= 5) {
        html += `
            <tr>
                ${renderWeekdayCell(date, 1, 0, 1)}
                ${renderWeekdayCell(date, 2, 0, 1)}
                ${renderWeekdayCell(date, 3, 0, 1)}
            </tr>
        `;
    } else {
        html += `
            <tr>
                <td colspan="3" class="day-shift${isToday(date) ? " today-col today-top" : ""}">
                    ${renderHolidayContent(date, "day")}
                </td>
            </tr>
            <tr>
                <td colspan="3" class="night-shift${isToday(date) ? " today-col today-bottom" : ""}">
                    ${renderHolidayContent(date, "night")}
                </td>
            </tr>
        `;
    }

    return html;
}

function renderHolidayContent(date, shiftType) {
    const work = getHolidayShift(date, shiftType);

    return `
        <div class="group-title">${work.label}</div>
        <div class="time">${work.time}</div>
        <div class="names">${work.names.join("<br>")}</div>
    `;
}

function renderMonth() {
    const year = currentMonthDate.getFullYear();
    const month = currentMonthDate.getMonth();

    document.getElementById("monthTitle").innerText =
        `${year}년 ${month + 1}월`;

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);

    let html = "";

    for (let d = new Date(firstDay); d <= lastDay; d.setDate(d.getDate() + 1)) {
        const date = new Date(d);
        html += renderMonthDayBlock(date);
    }

    document.getElementById("monthTable").innerHTML = html;
}

function changeMonth(offset) {
    currentMonthDate.setMonth(currentMonthDate.getMonth() + offset);
    renderMonth();
}

function showSection(id) {
    document.querySelectorAll(".section").forEach(sec => {
        sec.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    if (id === "week") renderWeek();
    if (id === "month") renderMonth();
}

renderWeek();
</script>

</body>
</html>
